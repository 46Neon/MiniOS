name: Android single-APK desktop prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitmodules'
      - 'android/**'
      - 'README.md'
      - 'docs/APK_DESKTOP_ROADMAP.md'
      - '.github/workflows/android-apk-desktop.yml'
  push:
    paths:
      - '.gitmodules'
      - 'android/**'
      - 'README.md'
      - 'docs/APK_DESKTOP_ROADMAP.md'
      - '.github/workflows/android-apk-desktop.yml'

permissions:
  contents: read

jobs:
  build-and-verify-android-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out MiniAriño and upstream X11 source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable KVM for API 26, 29, 30 and 35 emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build tools and Android 8, 10, 11 and 15 emulator images
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-26;google_apis;x86_64' 'system-images;android-29;google_apis;x86_64' 'system-images;android-30;google_apis;x86_64' 'system-images;android-35;google_apis;x86_64' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Install native Wayland cross-build host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson ninja-build pkg-config libexpat1-dev file

      - name: Verify XFCE packages in Debian Bookworm ARM64 and session startup contract
        run: python3 android/scripts/test_debian_xfce_contract.py

      # Build-time adaptation of pinned upstream Lorie sources only. This does
      # not patch an installed Termux/X11 app or add a runtime app dependency.
      - name: Prepare pinned Lorie source for embedded APK build
        run: python3 android/scripts/prepare_x11.py

      - name: Build, package, and validate pinned Android Wayland host dependencies
        run: bash scripts/build_wayland_android_poc.sh

      - name: Verify and stage pinned ARM64 PRoot runtime
        run: python3 android/scripts/fetch_proot_runtime.py android/app/src/main/assets/proot

      - name: Stage x86_64 PRoot fixture for Android emulator runtime test
        run: |
          python3 android/scripts/fetch_proot_runtime.py --arch x86_64 android/test-assets/proot-test-x86_64
          mkdir -p android/test-assets/proot-test-x86_64/licenses
          cp android/app/src/main/assets/proot-licenses/* android/test-assets/proot-test-x86_64/licenses/

      # This is a private test build only. The distributable ARM64 APK is built after every
      # requested API-level emulator has launched the real app and passed the PRoot guest test.
      - name: Run package and PRoot guest smoke on Android 8 (API 26)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -memory 4096
          disable-animations: true
          script: android/vendor/termux-x11/gradlew -p android --no-daemon -PminiarinoAbiFilter=x86_64 :app:connectedDebugAndroidTest

      - name: Run package and PRoot guest smoke on Android 10 (API 29)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -memory 4096
          disable-animations: true
          script: android/vendor/termux-x11/gradlew -p android --no-daemon -PminiarinoAbiFilter=x86_64 :app:connectedDebugAndroidTest

      - name: Run package and PRoot guest smoke on Android 11 (API 30)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -memory 4096
          disable-animations: true
          script: android/vendor/termux-x11/gradlew -p android --no-daemon -PminiarinoAbiFilter=x86_64 :app:connectedDebugAndroidTest

      - name: Retain proven modern Android 15 (API 35) runtime path
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -memory 4096
          disable-animations: true
          script: android/vendor/termux-x11/gradlew -p android --no-daemon -PminiarinoAbiFilter=x86_64 :app:connectedDebugAndroidTest

      - name: Build isolated ARM64 debug APK after all emulator gates pass
        run: android/vendor/termux-x11/gradlew -p android --no-daemon -PminiarinoAbiFilter=arm64-v8a :app:assembleDebug

      - name: Verify package identity, API contract and ARM64-only artifact
        run: |
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -s "$apk"
          "$aapt" dump badging "$apk" | grep -F "package: name='org.miniarino.desktop.sdk28test'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'MiniAriño prueba'"
          "$aapt" dump badging "$apk" | grep -F "sdkVersion:'26'"
          "$aapt" dump badging "$apk" | grep -F "targetSdkVersion:'28'"
          permissions="$("$aapt" dump permissions "$apk")"
          printf '%s\n' "$permissions"
          printf '%s\n' "$permissions" | grep -F "android.permission.INTERNET"
          printf '%s\n' "$permissions" | grep -F "android.permission.ACCESS_NETWORK_STATE"
          printf '%s\n' "$permissions" | grep -F "android.permission.FOREGROUND_SERVICE"
          printf '%s\n' "$permissions" | grep -F "android.permission.POST_NOTIFICATIONS"
          native_libs="$(unzip -Z1 "$apk" | grep -E '^lib/arm64-v8a/[^/]+\.so$')"
          test -n "$native_libs"
          unzip -Z1 "$apk" | awk '/^lib\/[^/]+\/[^/]+\.so$/ { if ($0 !~ /^lib\/arm64-v8a\//) unexpected=1 } END { exit unexpected }'
          echo "Verified ARM64-only native libraries:"
          printf '%s\n' "$native_libs"
          unzip -Z1 "$apk" | grep -Fx 'assets/proot/bin/proot'
          unzip -Z1 "$apk" | grep -Fx 'assets/proot/libexec/proot/loader'
          unzip -Z1 "$apk" | grep -Fx 'assets/proot/lib/libtalloc.so.2'
          unzip -Z1 "$apk" | grep -Fx 'assets/proot/lib/libandroid-shmem.so'
          unzip -Z1 "$apk" | grep -Fx 'assets/proot-licenses/GPL-2.0-only.txt'
          unzip -Z1 "$apk" | grep -Fx 'assets/linux/xfce-session.sh'
          apk_sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          echo "APK_SHA256=$apk_sha256" >> "$GITHUB_ENV"
          echo "APK_SHA256=$apk_sha256"

      - name: Upload compatibility-tested ARM64 sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: miniarino-apk-desktop-sdk28test-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
