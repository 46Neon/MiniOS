name: Standalone APK X11 integration spike

on:
  workflow_dispatch:
  push:
    paths:
      - '.gitmodules'
      - 'android/**'
      - '.github/workflows/android-apk-spike.yml'

permissions:
  contents: read

jobs:
  build-arm64-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out MiniAriño and upstream X11 source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Apply pinned upstream DSL compatibility patch
        run: python3 android/scripts/prepare_x11.py

      - name: Verify and stage pinned ARM64 PRoot runtime
        run: python3 android/scripts/fetch_proot_runtime.py android/app/src/main/assets/proot

      - name: Build the single-package ARM64 debug APK
        run: android/vendor/termux-x11/gradlew -p android --no-daemon :app:assembleDebug

      - name: Verify package identity and artifact
        run: |
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "package: name='org.miniarino.desktop'"
          native_libs="$(unzip -Z1 "$apk" | grep -E '^lib/arm64-v8a/[^/]+\.so$')"
          test -n "$native_libs"
          echo "Verified ARM64 native libraries:"
          printf '%s\n' "$native_libs"
          unzip -Z1 "$apk" | grep -Fx 'assets/proot/bin/proot'
          unzip -Z1 "$apk" | grep -Fx 'assets/proot/libexec/proot/loader'
          unzip -Z1 "$apk" | grep -Fx 'assets/proot/lib/libtalloc.so.2'
          unzip -Z1 "$apk" | grep -Fx 'assets/proot/lib/libandroid-shmem.so'
          unzip -Z1 "$apk" | grep -Fx 'assets/proot-licenses/GPL-2.0-only.txt'
          apk_sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          echo "APK_SHA256=$apk_sha256" >> "$GITHUB_ENV"
          echo "APK_SHA256=$apk_sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miniarino-embedded-x11-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
