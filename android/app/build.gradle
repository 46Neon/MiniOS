apply plugin: 'com.android.application'

android {
    namespace 'org.miniarino.desktop'
    compileSdk 34
    ndkVersion '29.0.14206865'

    // HomeActivity uses this flag to expose the host-proof entry only in debug builds.
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'org.miniarino.desktop'
        // Android 8.0 (API 26) is the supported minimum for the sideload prototype.
        minSdkVersion 26
        // Android blocks execve() from an app's writable private data directory when
        // targetSdkVersion >= 29. The standalone Linux runtime is intentionally stored
        // under getFilesDir(), so this app must retain the last supported legacy target.
        // This is a sideloaded prototype; it is not Play Store target-SDK compliant.
        targetSdkVersion 28
        // CI runs the exact launcher/PRoot smoke path on x86_64 emulators, then packages
        // only ARM64 native libraries for the side-load APK after those gates pass.
        if (project.hasProperty('miniarinoAbiFilter')) {
            ndk { abiFilters project.property('miniarinoAbiFilter').toString() }
        }
        versionCode 3
        versionName '0.3.0-xfce-exec-fix'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Keep this sideloaded debug prototype separate from the user's existing install.
    // Debug APKs use a distinct package, so installing them cannot replace the release app
    // or touch its private Debian/workspace data. Release identity remains unchanged.
    buildTypes {
        debug {
            applicationIdSuffix '.sdk28test'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        androidTest {
            assets.srcDirs += [file('../test-assets')]
        }
    }
}

dependencies {
    implementation project(':lorie')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
